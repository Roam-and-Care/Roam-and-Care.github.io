<header>
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e5e5; padding-bottom: 0.5rem; margin-bottom: 1rem;">
    <div>
      <h1 style="margin: 0; font-size: 1.8rem;">
        <a href="{{ "/" | relative_url }}" style="text-decoration: none; color: #333;">
          {{ site.title | default: site.github.repository_name }}
        </a>
      </h1>
      {% if site.description %}
        <p style="margin: 0; color: #666; font-size: 0.9rem;">{{ site.description }}</p>
      {% endif %}
    </div>
    <nav>
      <a href="{{ "/" | relative_url }}" style="margin-left: 1.5rem; text-decoration: none; color: #333; font-weight: 500;">Home</a>
      <a href="{{ "/about/" | relative_url }}" style="margin-left: 1.5rem; text-decoration: none; color: #333; font-weight: 500;">About</a>
      <a href="{{ "/services/" | relative_url }}" style="margin-left: 1.5rem; text-decoration: none; color: #333; font-weight: 500;">Services</a>
      <a href="{{ "/contact/" | relative_url }}" style="margin-left: 1.5rem; text-decoration: none; color: #333; font-weight: 500;">Contact</a>
    </nav>
  </div>
</header>
